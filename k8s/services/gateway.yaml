apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: haillion
  labels:
    app: gateway
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: haillion
  labels:
    app: gateway
  annotations:
    checkov.io/skip1: CKV_K8S_15=Local development requires IfNotPresent
    checkov.io/skip2: CKV_K8S_43=Local development uses tag instead of digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: haillion-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          args:
            - "-port=8080"
          env:
            - name: IDENTITY_URL
              value: "http://identity:8081"
            - name: MATCHING_URL
              value: "http://matching:8082"
            - name: TRIP_URL
              value: "http://trip:8083"
            - name: BILLING_URL
              value: "http://billing:8084"
            - name: REVIEW_URL
              value: "http://review:8085"
            - name: NOTIFICATION_URL
              value: "http://notification:8086"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: haillion
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
