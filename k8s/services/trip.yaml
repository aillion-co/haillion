apiVersion: v1
kind: Service
metadata:
  name: trip
  namespace: aillion
  labels:
    app: trip
spec:
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
  selector:
    app: trip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip
  namespace: aillion
  labels:
    app: trip
  annotations:
    checkov.io/skip1: CKV_K8S_15=Local development requires IfNotPresent
    checkov.io/skip2: CKV_K8S_43=Local development uses tag instead of digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip
  template:
    metadata:
      labels:
        app: trip
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trip
          image: aillion-trip:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              protocol: TCP
          args:
            - "-port=8083"
            - "-db=postgres://postgres:postgres@postgres:5432/aillion?sslmode=disable"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip
  namespace: aillion
spec:
  podSelector:
    matchLabels:
      app: trip
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8083
