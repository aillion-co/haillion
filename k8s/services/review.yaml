apiVersion: v1
kind: Service
metadata:
  name: review
  namespace: haillion
  labels:
    app: review
spec:
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
  selector:
    app: review
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  namespace: haillion
  labels:
    app: review
  annotations:
    checkov.io/skip1: CKV_K8S_15=Local development requires IfNotPresent
    checkov.io/skip2: CKV_K8S_43=Local development uses tag instead of digest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review
  template:
    metadata:
      labels:
        app: review
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: review
          image: haillion-review:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              protocol: TCP
          args:
            - "-port=8085"
            - "-db=postgres://postgres:postgres@postgres:5432/haillion?sslmode=disable"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: review
  namespace: haillion
spec:
  podSelector:
    matchLabels:
      app: review
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8085
